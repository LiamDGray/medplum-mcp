[workspace]
resolver = "2"
members = [
    "crates/medplum-mcp-core",
    "crates/medplum-mcp-server",
    "crates/medplum-mcp-cli",
    "crates/modbus-mcp-core",
    "crates/modbus-mcp-server",
    "crates/modbus-mcp-cli",
]
exclude = [
    "fuzz",
]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
