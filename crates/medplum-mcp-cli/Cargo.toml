[package]
name = "medplum-mcp-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "medplum-mcp-rs"
path = "src/main.rs"

[lib]
name = "medplum_mcp_cli"
path = "src/lib.rs"

[dependencies]
medplum-mcp-core = { path = "../medplum-mcp-core" }
medplum-mcp-server = { path = "../medplum-mcp-server" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2.2"
thiserror = "2.0"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
zerocopy = "0.8"
ratatui = "0.29"
crossterm = "0.28"
simd-json = "0.14"


[dev-dependencies]
