[package]
name = "medplum-mcp-core"
version = "0.1.0"
edition = "2021"
description = "High-assurance FHIR R4 token distillation, affine typestates, and zero-copy cryptographic audit vault for Medplum MCP"
license = "Apache-2.0"
repository = "https://github.com/LiamDGray/medplum-mcp"
homepage = "https://github.com/LiamDGray/medplum-mcp"
readme = "README.md"
keywords = ["fhir", "mcp", "medplum", "healthcare", "ai"]
categories = ["development-tools", "api-bindings"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = { version = "0.14", features = ["serde_impl"] }
zerocopy = { version = "0.8", features = ["derive"] }
rkyv = { version = "0.8", features = ["bytecheck"] }
unicode-normalization = "0.1"
thiserror = "2.0"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
proptest = "1.5"
tempfile = "3.10"

[features]
default = []

[lints]
workspace = true
